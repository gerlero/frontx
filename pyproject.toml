[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[project]
name = "frontx"
version = "0.1.3"
license = "Apache-2.0"
authors = [{ name = "Gabriel S. Gerlero", email = "ggerlero@cimec.unl.edu.ar" }]
description = "Nonlinear diffusion problems with JAX"
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
    "Operating System :: OS Independent",
]
requires-python = ">=3.12"
dependencies = [
    "diffrax>=0.7,<0.8",
    "equinox>=0.12.1,<0.14",
    "interpax>=0.3.13,<0.4",
    "jax>=0.8,<0.12",
    "numpy>=2.4.1,<3",
    "optax>=0.2.4,<0.3",
    "optimistix>=0.0.10,<0.1",
    "parametrix>=0.1.4,<0.2",
    "scipy>=1.16.1,<2",
]

[project.optional-dependencies]
examples = ["matplotlib>=3.11,<4"]

[project.urls]
Homepage = "https://github.com/gerlero/frontx"
Repository = "https://github.com/gerlero/frontx"
Documentation = "https://frontx.readthedocs.io"

[dependency-groups]
examples = ["frontx[examples]"]
lint = ["ruff>=0.16.5,<0.17"]
typing = [
    {include-group = "examples"},
    "ty>=0.0.76,<0.1"
]
test = [
    "fronts>=1,<2",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
]
docs = [
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=9.6.12,<10",
    "mkdocstrings[python]>=0.29.1,<1.1",
]
dev = [
    {include-group = "examples"},
    {include-group = "lint"},
    {include-group = "typing"},
    {include-group = "test"},
    {include-group = "docs"},
]

[tool.ruff.lint.pydocstyle]
convention = "google"
